<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="card-custom p-4 p-md-5 mb-4 shadow-md border-0 animate-slide-up">
          <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fs-3" style="width:58px; height:58px;">
              <i class="fa-solid fa-user-gear"></i>
            </div>
            <div>
              <h3 class="fw-extrabold text-dark mb-0">Profile & Campus Account</h3>
              <p class="text-muted small mb-0">Manage your contact information and department details</p>
            </div>
          </div>

          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" id="profName" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">College Email (Verified)</label>
                <div class="input-group">
                  <input type="email" id="profEmail" class="form-control bg-light" readonly>
                  <span class="input-group-text bg-success-subtle text-success border-start-0"><i class="fa-solid fa-check"></i></span>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">College Roll Number (Read-Only)</label>
                <input type="text" id="profCollegeId" class="form-control bg-light" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Phone</label>
                <input type="tel" id="profPhone" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Department</label>
                <input type="text" id="profDept" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Academic Year</label>
                <select id="profYear" class="form-select">
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                  <option value="PG / Master">PG / Master</option>
                  <option value="Faculty / Staff">Faculty / Staff</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom fw-bold rounded-pill mt-4 px-4 shadow">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile Changes
            </button>
          </form>
        </div>

        <!-- Password Change Box -->
        <div class="card-custom p-4 p-md-5 shadow-md border-0 animate-slide-up">
          <h4 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-key text-warning me-2"></i> Update Password</h4>
          <p class="text-muted small mb-4">Ensure your account uses a secure password of at least 6 characters</p>

          <form id="passwordForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Current Password</label>
                <input type="password" id="currentPassword" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
              </div>
            </div>
            <button type="submit" class="btn btn-outline-warning fw-bold rounded-pill mt-4 px-4">
              <i class="fa-solid fa-shield-halved me-1"></i> Update Password
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth();
      loadProfile();

      document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await API.put('/users/profile', {
            name: document.getElementById('profName').value,
            phone: document.getElementById('profPhone').value,
            department: document.getElementById('profDept').value,
            year: document.getElementById('profYear').value,
          });
          if (res.success) {
            Auth.setSession(Auth.getToken(), res.data);
            API.showToast('Profile updated successfully!', 'success');
          }
        } catch (err) {
          API.showToast(err.message || 'Update failed', 'error');
        }
      });

      document.getElementById('passwordForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await API.put('/users/change-password', {
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value,
          });
          if (res.success) {
            API.showToast('Password updated successfully!', 'success');
            document.getElementById('passwordForm').reset();
          }
        } catch (err) {
          API.showToast(err.message || 'Password update failed', 'error');
        }
      });
    });

    async function loadProfile() {
      try {
        const res = await API.get('/users/profile');
        if (res.success) {
          const u = res.data;
          document.getElementById('profName').value = u.name;
          document.getElementById('profEmail').value = u.email;
          document.getElementById('profCollegeId').value = u.collegeId;
          document.getElementById('profPhone').value = u.phone;
          document.getElementById('profDept').value = u.department;
          document.getElementById('profYear').value = u.year || '1st Year';
        }
      } catch (e) {}
    }
  </script>
</body>
</html>

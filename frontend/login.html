<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Demo Role Fast Switcher Card -->
                <div class="card border-primary border-2 mb-4 shadow-sm bg-primary-subtle rounded-3">
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold text-primary mb-0"><i class="fa-solid fa-bolt me-1 text-warning"></i> Quick Demo Role Login:</h6>
              <span class="badge bg-primary text-white small">1-Click Fill</span>
            </div>
            <p class="small text-muted mb-2">Click any role to autofill test credentials:</p>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" onclick="fillDemo('admin@college.edu')" class="btn btn-sm btn-dark rounded-pill px-3 shadow-sm">
                <i class="fa-solid fa-user-shield me-1"></i> Admin
              </button>
              <button type="button" onclick="fillDemo('staff@college.edu')" class="btn btn-sm btn-primary rounded-pill px-3 shadow-sm">
                <i class="fa-solid fa-user-tie me-1"></i> Staff / Security
              </button>
              <button type="button" onclick="fillDemo('student@college.edu')" class="btn btn-sm btn-success rounded-pill px-3 shadow-sm">
                <i class="fa-solid fa-graduation-cap me-1"></i> Student
              </button>
            </div>
          </div>
        </div> 

        <!-- Main Login Card -->
        <div class="card-custom p-4 p-md-5 shadow-lg border-0 animate-slide-up">
          <div class="text-center mb-4">
            <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-2 animate-float" style="width:60px; height:60px; font-size:1.5rem;">
              <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h3 class="fw-extrabold text-dark">Welcome Back</h3>
            <p class="text-muted small">Sign in using your account credentials</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control form-control-lg border-start-0 ps-0" placeholder="name@college.edu or gmail" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-semibold mb-0">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control form-control-lg border-start-0 border-end-0 ps-0" placeholder="••••••••" required>
                <button type="button" class="input-group-text bg-light border-start-0" onclick="togglePassVisibility('password', this)">
                  <i class="fa-solid fa-eye text-muted"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-3 fw-bold rounded-pill mb-3 shadow">
              <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
            </button>
          </form>

          <div class="text-center text-muted small pt-3 border-top">
            Don't have an account yet? <a href="/register.html" class="fw-bold text-primary">Register with College ID</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'Password123!';
      API.showToast(`Autofilled demo credentials for ${email}`, 'info');
    }

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-primary';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-muted';
      }
    }

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Logging in...`;

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.success) {
          Auth.setSession(res.token, res.data);
          API.showToast('Login successful! Redirecting...', 'success');
          const urlParams = new URLSearchParams(window.location.search);
          const returnUrl = urlParams.get('returnUrl');
          setTimeout(() => {
            if (returnUrl && returnUrl.startsWith('/')) {
              window.location.href = decodeURIComponent(returnUrl);
            } else if (res.data.role === 'ADMIN' || res.data.role === 'STAFF') {
              window.location.href = '/admin/dashboard.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 700);
        }
      } catch (err) {
        API.showToast(err.message || 'Login failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i> Log In`;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .otp-input-box {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.4rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 12px;
      color: var(--primary);
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 0.8rem;
      transition: var(--transition);
    }
    .otp-input-box:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: var(--shadow-glow);
    }
  </style>
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5 shadow-lg text-center border-0 animate-slide-up">
          <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-3 animate-float" style="width:68px; height:68px; font-size:1.8rem;">
            <i class="fa-solid fa-envelope-circle-check"></i>
          </div>
          <h3 class="fw-extrabold text-dark mb-1">Verify College Email</h3>
          <p class="text-muted small mb-4">
            We sent a 6-digit verification code to:<br>
            <strong id="targetEmail" class="text-primary fs-6">loading...</strong>
          </p>

          <form id="verifyForm">
            <div class="mb-4">
              <input type="text" id="otpCode" class="form-control otp-input-box" placeholder="••••••" maxlength="6" autofocus required>
              <div class="form-text mt-2 small text-muted">
                <i class="fa-solid fa-circle-info text-primary me-1"></i> Check your Gmail Inbox or Spam folder.
              </div>
            </div>

            <button type="submit" id="verifyBtn" class="btn btn-primary-custom w-100 py-3 fw-bold rounded-pill mb-3 shadow">
              <i class="fa-solid fa-check-double me-2"></i> Confirm OTP & Activate
            </button>
          </form>

          <div class="pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
            <button type="button" id="resendBtn" onclick="handleResend()" class="btn btn-link text-decoration-none small text-muted p-0">
              <i class="fa-solid fa-rotate-right me-1"></i> Resend OTP Code
            </button>
            <span id="countdownTimer" class="small text-muted"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');

    document.addEventListener('DOMContentLoaded', () => {
      if (!email) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('targetEmail').textContent = email;
      startCooldown(60);
    });

    let cooldownInterval;
    function startCooldown(seconds) {
      const resendBtn = document.getElementById('resendBtn');
      const timerSpan = document.getElementById('countdownTimer');
      resendBtn.classList.add('disabled', 'text-muted');
      let remaining = seconds;

      clearInterval(cooldownInterval);
      cooldownInterval = setInterval(() => {
        timerSpan.textContent = `(${remaining}s remaining)`;
        remaining--;
        if (remaining < 0) {
          clearInterval(cooldownInterval);
          timerSpan.textContent = '';
          resendBtn.classList.remove('disabled', 'text-muted');
          resendBtn.classList.add('text-primary');
        }
      }, 1000);
    }

    document.getElementById('verifyForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otpCode').value.trim();
      const btn = document.getElementById('verifyBtn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Verifying...`;

      try {
        const res = await API.post('/auth/verify-otp', { email, otp });
        if (res.success) {
          Auth.setSession(res.token, res.data);
          API.showToast('Account successfully verified! Welcome aboard.', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        }
      } catch (err) {
        API.showToast(err.message || 'Verification failed', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check-double me-2"></i> Confirm OTP & Activate`;
      }
    });

    async function handleResend() {
      try {
        const res = await API.post('/auth/resend-otp', { email });
        API.showToast(res.message || 'Fresh OTP code sent to your email!', 'info');
        startCooldown(60);
      } catch (err) {
        API.showToast(err.message || 'Failed to resend OTP', 'error');
      }
    }
  </script>
</body>
</html>

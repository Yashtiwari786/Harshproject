<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found Items Directory — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <!-- Unified Campus Header Banner -->
  <div class="py-4" style="background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #201755 100%); color:#ffffff; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <span class="badge bg-white bg-opacity-10 border border-white border-opacity-20 text-white fw-bold px-3 py-1 rounded-pill mb-2">
          <i class="fa-solid fa-layer-group text-primary me-1"></i> Campus Public Directory
        </span>
        <h2 class="fw-extrabold text-white mb-1"><i class="fa-solid fa-hand-holding-heart text-success me-2"></i> Reported Found Items</h2>
        <p class="mb-0 text-white-50 small">Browse found belongings safely deposited across campus security lockers and reception desks.</p>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <a href="/report-found.html" class="btn btn-secondary-custom rounded-pill px-4 fw-bold shadow">
          <i class="fa-solid fa-plus me-1"></i> Report Found Item
        </a>
        <a href="/lost-items.html" class="btn btn-outline-light rounded-pill px-3 fw-semibold">
          <i class="fa-solid fa-magnifying-glass me-1"></i> Lost Directory
        </a>
      </div>
    </div>
  </div>

  <div class="container py-5 mb-5" style="min-height: 75vh;">
    <div class="row g-4">
      
      <!-- Filter Sidebar -->
      <div class="col-lg-3">
        <div class="card-custom p-3 shadow-sm filter-sidebar-sticky">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-filter text-secondary me-2"></i> Filters</h6>
            <button type="button" onclick="resetFilters()" class="btn btn-link text-muted p-0 small text-decoration-none">Reset</button>
          </div>
          <form id="filterForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Keywords</label>
              <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Title, brand, color...">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Category</label>
              <select id="filterCategory" class="form-select form-select-sm">
                <option value="">All Categories</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Campus Location</label>
              <select id="filterLocation" class="form-select form-select-sm">
                <option value="">All Locations</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Sort By</label>
              <select id="filterSort" class="form-select form-select-sm">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
              </select>
            </div>

            <button type="submit" class="btn btn-secondary-custom w-100 btn-sm rounded-pill mb-2">Apply Filters</button>
            <button type="button" onclick="resetFilters()" class="btn btn-outline-secondary w-100 btn-sm rounded-pill">Clear Filters</button>
          </form>
        </div>
      </div>

      <!-- Items Grid -->
      <div class="col-lg-9">
        <div id="itemsContainer" class="row g-4">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-secondary" role="status"></div>
            <p class="text-muted mt-2">Fetching found items...</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadCategoriesAndLocations();

      const params = new URLSearchParams(window.location.search);
      if (params.get('search')) document.getElementById('filterSearch').value = params.get('search');
      if (params.get('category')) document.getElementById('filterCategory').value = params.get('category');
      if (params.get('location')) document.getElementById('filterLocation').value = params.get('location');

      fetchFoundItems();

      document.getElementById('filterForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        fetchFoundItems();
      });
    });

    async function loadCategoriesAndLocations() {
      try {
        const [catRes, locRes] = await Promise.all([API.get('/categories'), API.get('/locations')]);
        if (catRes.success) {
          const select = document.getElementById('filterCategory');
          const targetVal = new URLSearchParams(window.location.search).get('category');
          catRes.data.forEach(c => {
            select.innerHTML += `<option value="${c.name}" ${targetVal === c.name ? 'selected' : ''}>${c.name}</option>`;
          });
        }
        if (locRes.success) {
          const select = document.getElementById('filterLocation');
          const targetVal = new URLSearchParams(window.location.search).get('location');
          locRes.data.forEach(l => {
            select.innerHTML += `<option value="${l.name}" ${targetVal === l.name ? 'selected' : ''}>${l.name}</option>`;
          });
        }
      } catch (e) {}
    }

    async function fetchFoundItems() {
      const container = document.getElementById('itemsContainer');
      const search = document.getElementById('filterSearch').value;
      const category = document.getElementById('filterCategory').value;
      const location = document.getElementById('filterLocation').value;
      const sort = document.getElementById('filterSort').value;

      let query = `?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}&location=${encodeURIComponent(location)}&sort=${encodeURIComponent(sort)}`;

      try {
        const res = await API.get(`/found${query}`);
        if (res.success && res.data.length > 0) {
          container.innerHTML = res.data.map(item => {
            const isHandedOver = ['HANDED_OVER', 'RETURNED', 'CLOSED'].includes(item.status);
            return `
              <div class="col-md-6 col-lg-4 animate-slide-up">
                <div class="card-custom h-100 d-flex flex-column justify-content-between">
                  <div style="cursor: pointer;" onclick="window.location.href='/item.html?type=found&id=${item._id}'">
                    <div class="item-img-wrapper">
                      <img src="${item.images && item.images.length > 0 ? item.images[0].url : 'https://images.unsplash.com/photo-1627123424574-724758594e93?w=600&q=80'}" alt="${item.title}">
                      <span class="position-absolute top-0 end-0 m-3 badge-status ${isHandedOver ? 'bg-success text-white' : 'badge-found'} shadow-sm">
                        ${isHandedOver ? '<i class="fa-solid fa-circle-check me-1"></i> HANDED OVER' : 'FOUND'}
                      </span>
                    </div>
                    <div class="p-3">
                      <span class="badge bg-light text-dark border mb-2">${item.category}</span>
                      <h5 class="fw-bold text-truncate mb-1 text-dark">${item.title}</h5>
                      <p class="text-muted small mb-3 text-truncate">${item.description}</p>
                      <div class="small text-muted mb-2">
                        <div><i class="fa-solid fa-location-dot me-1 text-secondary"></i> Found: ${item.location}</div>
                        <div><i class="fa-solid fa-building-shield me-1 text-secondary"></i> Storage: <span class="badge bg-light text-dark border">${item.currentStorageLocation || 'Security Office'}</span></div>
                      </div>
                    </div>
                  </div>
                  <div class="p-3 pt-0 border-top mt-2">
                    ${isHandedOver ? `
                      <button disabled class="btn btn-success-subtle text-success border border-success-subtle btn-sm w-100 fw-bold rounded-pill mb-2">
                        <i class="fa-solid fa-circle-check me-1"></i> Handed Over to Owner
                      </button>
                    ` : `
                      <a href="/claim.html?itemId=${item._id}&itemModel=FoundItem" class="btn btn-secondary-custom btn-sm w-100 fw-bold rounded-pill mb-2 shadow-sm">
                        <i class="fa-solid fa-hand-holding-heart me-1"></i> Claim "This Might Be Mine"
                      </a>
                    `}
                    <a href="/item.html?type=found&id=${item._id}" class="btn btn-outline-secondary btn-sm w-100 rounded-pill">
                      <i class="fa-solid fa-eye me-1"></i> View Full Details
                    </a>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = `
            <div class="col-12 text-center py-5 card-custom p-5">
              <i class="fa-solid fa-box-open fs-1 text-muted mb-3"></i>
              <h5 class="fw-bold text-dark">No Found Items Listed</h5>
              <p class="text-muted small mb-3">No active reports match your search criteria.</p>
              <button onclick="resetFilters()" class="btn btn-sm btn-secondary rounded-pill px-3">Clear Filters</button>
            </div>
          `;
        }
      } catch (err) {
        console.error('Error fetching found items:', err);
        container.innerHTML = `
          <div class="col-12 text-center py-5 card-custom p-4 text-danger">
            <i class="fa-solid fa-triangle-exclamation fs-2 mb-2"></i>
            <h6 class="fw-bold">Unable to load found items at this moment</h6>
            <p class="small text-muted mb-3">${err.message || 'Please check your connection and try again.'}</p>
            <button onclick="fetchFoundItems()" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
              <i class="fa-solid fa-rotate-right me-1"></i> Retry
            </button>
          </div>
        `;
      }
    }

    function resetFilters() {
      document.getElementById('filterSearch').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterLocation').value = '';
      document.getElementById('filterSort').value = 'newest';
      fetchFoundItems();
    }
  </script>
</body>
</html>

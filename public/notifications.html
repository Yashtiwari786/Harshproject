<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-1 rounded-pill mb-1">Campus Alert Inbox</span>
            <h3 class="fw-extrabold text-dark mb-0"><i class="fa-solid fa-bell text-primary me-2"></i> In-App Notifications</h3>
            <p class="text-muted small mb-0">Stay updated on matches, claim reviews, and handover instructions</p>
          </div>
          <button onclick="markAllRead()" class="btn btn-outline-primary btn-sm rounded-pill fw-semibold px-3 shadow-sm">
            <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
          </button>
        </div>

        <div id="notificationsContainer" class="d-flex flex-column gap-3">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Loading notifications...</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth();
      fetchNotifications();
    });

    async function fetchNotifications() {
      const container = document.getElementById('notificationsContainer');
      try {
        const res = await API.get('/notifications');
        if (res.success && res.data.length > 0) {
          container.innerHTML = res.data.map(n => `
            <div class="card-custom p-3 ${!n.isRead ? 'border-start border-4 border-primary bg-primary-subtle' : ''}">
              <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="badge ${getNotifBadgeClass(n.type)}">${formatType(n.type)}</span>
                    <small class="text-muted opacity-75">${new Date(n.createdAt).toLocaleString()}</small>
                  </div>
                  <h6 class="fw-bold text-dark mb-1">${n.title}</h6>
                  <p class="text-muted small mb-0">${n.message}</p>
                </div>
                ${n.link ? `<a href="${n.link}" class="btn btn-sm btn-primary rounded-pill px-3 flex-shrink-0">View</a>` : ''}
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="text-center py-5 card-custom p-5">
              <i class="fa-solid fa-bell-slash fs-1 text-muted mb-3"></i>
              <h5 class="fw-bold text-dark">You're All Caught Up!</h5>
              <p class="text-muted small mb-0">No new notifications in your inbox.</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Failed to load notifications.</div>`;
      }
    }

    function getNotifBadgeClass(type) {
      if (type.includes('MATCH')) return 'bg-info text-white';
      if (type.includes('APPROVED')) return 'bg-success text-white';
      if (type.includes('REJECTED')) return 'bg-danger text-white';
      if (type.includes('SECURITY') || type.includes('ALERT')) return 'bg-danger text-white';
      if (type.includes('BROADCAST')) return 'bg-warning text-dark';
      if (type.includes('STAFF_ANNOUNCEMENT')) return 'bg-primary text-white';
      return 'bg-secondary text-white';
    }

    function formatType(type) {
      return type.replace(/_/g, ' ');
    }

    async function markAllRead() {
      try {
        const res = await API.put('/notifications/read-all');
        if (res.success) {
          API.showToast('All notifications marked as read', 'success');
          fetchNotifications();
          const badge = document.getElementById('unreadNavBadge');
          if (badge) badge.classList.add('d-none');
        }
      } catch (err) {
        API.showToast('Failed to update notifications', 'error');
      }
    }
  </script>
</body>
</html>

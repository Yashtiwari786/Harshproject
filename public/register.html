<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — Lost2Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbarContainer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        
        <div class="card-custom p-4 p-md-5 shadow-lg border-0 animate-slide-up">
          <div class="text-center mb-4">
            <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-2 animate-float" style="width:60px; height:60px; font-size:1.5rem;">
              <i class="fa-solid fa-user-plus"></i>
            </div>
            <h3 class="fw-extrabold text-dark">Create College Account</h3>
            <p class="text-muted small">Register with your official student or staff details. An email OTP will be sent to verify your address.</p>
          </div>

          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                  <input type="text" id="name" class="form-control" placeholder="Aarav Gupta" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">College ID / Roll No *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
                  <input type="text" id="collegeId" class="form-control" placeholder="2024-BCA-042" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                  <input type="email" id="email" class="form-control" placeholder="yourname@gmail.com or college email" required>
                </div>
                <div class="form-text small">Your OTP verification code will be sent to this email address.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Number *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                  <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Department *</label>
                <select id="department" class="form-select" required>
                  <option value="">Select Department</option>
                  <option value="Computer Applications (BCA)">Computer Applications (BCA)</option>
                  <option value="Business Administration (BBA)">Business Administration (BBA)</option>
                  <option value="Computer Science Engineering">Computer Science Engineering</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Commerce & Accounts">Commerce & Accounts</option>
                  <option value="Arts & Humanities">Arts & Humanities</option>
                  <option value="Faculty / Staff">Faculty / Staff</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Academic Year</label>
                <select id="year" class="form-select">
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                  <option value="PG / Master">PG / Master</option>
                  <option value="Faculty / Staff">Faculty / Staff</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Password *</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Confirm Password *</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-3 fw-bold rounded-pill mt-4 mb-3 shadow">
              <i class="fa-solid fa-paper-plane me-2"></i> Register & Send Email OTP
            </button>
          </form>

          <div class="text-center text-muted small pt-3 border-top">
            Already registered? <a href="/login.html" class="fw-bold text-primary">Log in here</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const collegeId = document.getElementById('collegeId').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const department = document.getElementById('department').value;
      const year = document.getElementById('year').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        API.showToast('Passwords do not match', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Dispatching OTP...`;

      try {
        const res = await API.post('/auth/register', {
          name, collegeId, email, phone, department, year, password
        });

        if (res.success) {
          API.showToast('Registration successful! OTP sent to your email.', 'success');
          setTimeout(() => {
            window.location.href = `/verify.html?email=${encodeURIComponent(email)}`;
          }, 1000);
        }
      } catch (err) {
        API.showToast(err.message || 'Registration failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane me-2"></i> Register & Send Email OTP`;
      }
    });
  </script>
</body>
</html>
